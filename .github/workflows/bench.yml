name: Benchmark

# LongMemEval against the memory code, started by hand (Actions > Benchmark >
# Run workflow). Needs the repository secrets CLOUDFLARE_ACCOUNT_ID and
# CLOUDFLARE_API_TOKEN (Workers AI Read and Edit). Workers AI answers are
# cached between runs, so a rerun only pays for inputs that changed.
# See bench/README.md.
on:
  workflow_dispatch:
    inputs:
      questions:
        description: "Number of questions, stratified by type (empty: all 500)"
        required: false
        default: ""
      extraction:
        description: "Extract notes from every session (slow, about 18 requests a minute)"
        type: boolean
        default: false
      features:
        description: "Recall steps, comma separated, or none (empty: as deployed)"
        required: false
        default: ""
      chunking:
        description: "Episode chunking (empty: as deployed)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: bench
  cancel-in-progress: false

jobs:
  longmemeval:
    runs-on: ubuntu-latest
    # Cloudflare credentials live in the main-only production environment.
    environment: production
    timeout-minutes: 355
    steps:
      - name: Check the secrets
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ] || [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Add the repository secrets CLOUDFLARE_ACCOUNT_ID and CLOUDFLARE_API_TOKEN (Workers AI Read and Edit)."
            exit 1
          fi
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci --prefer-offline --no-audit --no-fund
      - name: Restore the dataset
        id: data
        uses: actions/cache@v6
        with:
          path: bench/data
          key: longmemeval-s-cleaned-v1
      - if: steps.data.outputs.cache-hit != 'true'
        run: npm run bench -- download
      - name: Restore the AI cache
        uses: actions/cache/restore@v6
        with:
          path: bench/cache
          key: bench-ai-${{ github.run_id }}
          restore-keys: bench-ai-
      - name: Run
        id: run
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          BENCH_QUESTIONS: ${{ inputs.questions }}
          BENCH_EXTRACTION: ${{ inputs.extraction }}
          BENCH_FEATURES: ${{ inputs.features }}
          BENCH_CHUNKING: ${{ inputs.chunking }}
        run: |
          args=(--out "bench/runs/$GITHUB_RUN_ID" --max-minutes 300)
          if [ -n "$BENCH_QUESTIONS" ]; then args+=(--sample "$BENCH_QUESTIONS"); fi
          if [ "$BENCH_EXTRACTION" = "true" ]; then args+=(--extraction); fi
          if [ -n "$BENCH_FEATURES" ]; then args+=(--features "$BENCH_FEATURES"); fi
          if [ -n "$BENCH_CHUNKING" ]; then args+=(--chunking "$BENCH_CHUNKING"); fi
          npm run bench -- "${args[@]}"
      - name: Save the AI cache
        if: always() && steps.run.outcome != 'skipped'
        uses: actions/cache/save@v6
        with:
          path: bench/cache
          key: bench-ai-${{ github.run_id }}
      - name: Summary
        if: always()
        run: |
          if [ -f "bench/runs/$GITHUB_RUN_ID/summary.md" ]; then cat "bench/runs/$GITHUB_RUN_ID/summary.md" >> "$GITHUB_STEP_SUMMARY"; fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: longmemeval-${{ github.run_id }}
          path: |
            bench/runs/${{ github.run_id }}/*.json
            bench/runs/${{ github.run_id }}/*.jsonl
            bench/runs/${{ github.run_id }}/*.md
          if-no-files-found: ignore
